name: GNOME 50 visual smoke (experimental)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/gnome-visual-smoke.yml'
      - 'scripts/ci/gnome50-visual-smoke.sh'
      - 'extensions/localzet-shell@localzet.com/**'
      - 'assets/wallpapers/**'
      - 'scripts/ci/check-nectarlink-tray.py'
concurrency:
  group: gnome-visual-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  gnome-visual:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install GNOME 50 devkit on disposable runner
        run: |
          installed=0
          for attempt in 1 2 3; do
            sudo apt-get -o Acquire::Retries=2 update
            if sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=2 install -y --no-install-recommends gnome-shell gnome-shell-extension-appindicator mutter-dev-bin xdotool xwayland xvfb dbus-x11 mesa-utils imagemagick python3-pil x11-utils pipewire wireplumber ptyxis; then
              installed=1
              break
            fi
            echo "APT archive changed during GNOME devkit setup (attempt $attempt); resyncing"
            sudo apt-get clean
          done
          test "$installed" -eq 1
          gnome-shell --version
      - name: Install verified upstream NectarLink for tray integration test
        run: |
          python3 scripts/fetch-nectarlink-deb.py --output out/nectarlink
          python3 scripts/check-nectarlink-control.py out/nectarlink/nectarlink_0.1.5_amd64.deb
          sudo apt-get install -y --no-install-recommends "$PWD/out/nectarlink/nectarlink_0.1.5_amd64.deb"
      - name: Launch GNOME 50 and capture actual screen
        timeout-minutes: 7
        run: bash scripts/ci/gnome50-visual-smoke.sh
      - name: Upload screenshot and runtime logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gnome50-devkit-screenshot-and-logs
          path: out/gnome-smoke/
          if-no-files-found: ignore
          retention-days: 7
