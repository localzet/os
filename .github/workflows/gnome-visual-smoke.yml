name: GNOME 50 visual smoke (experimental)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/gnome-visual-smoke.yml'
      - 'scripts/ci/gnome50-visual-smoke.sh'
      - 'scripts/ci/settings-gtk-smoke.sh'
      - 'extensions/localzet-shell@localzet.com/**'
      - 'assets/design-tokens.json'
      - 'assets/icons/**'
      - 'assets/wallpapers/**'
      - 'theme/icons/**'
      - 'scripts/generate-icon-theme.py'
      - 'src/localzet/settings/**'
      - 'apps/localzet-settings/**'
      - 'packaging/com.localzet.Settings.*'
concurrency:
  group: gnome-visual-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  gnome-visual:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install GNOME 50 devkit on disposable runner
        run: |
          installed=0
          for attempt in 1 2 3; do
            sudo apt-get -o Acquire::Retries=2 update
            if sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=2 install -y --no-install-recommends gnome-shell mutter-dev-bin xwayland xvfb dbus-x11 mesa-utils imagemagick python3-pil python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 libglib2.0-bin x11-utils xdotool pipewire wireplumber ptyxis nautilus gnome-control-center; then
              installed=1
              break
            fi
            echo "APT archive changed during GNOME devkit setup (attempt $attempt); resyncing"
            sudo apt-get clean
          done
          test "$installed" -eq 1
          gnome-shell --version
      - name: Launch Localzet Settings in isolated GTK display
        timeout-minutes: 3
        run: xvfb-run -a -s '-screen 0 1280x800x24 -nolisten tcp' bash scripts/ci/settings-gtk-smoke.sh
      - name: Launch GNOME Shell devkit and capture screens
        timeout-minutes: 7
        run: bash scripts/ci/gnome50-visual-smoke.sh
      - name: Upload screenshot and runtime logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gnome50-devkit-screenshot-and-logs
          path: |
            out/gnome-smoke/
            out/settings/
          if-no-files-found: ignore
          retention-days: 7
