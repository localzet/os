name: P0 source checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Python tests and module validation
        run: make test
      - name: Validate shell JavaScript syntax
        run: |
          node --check extensions/localzet-shell@localzet.com/extension.js
          node --check extensions/localzet-shell@localzet.com/dock.js
      - name: Validate shell-install script syntax
        run: bash -n scripts/install-shell-dev.sh
      - name: Build and inspect desktop overlay package
        run: |
          bash -n scripts/build-desktop-deb.sh
          make desktop-deb
          dpkg-deb --contents dist/localzet-desktop_0.1.0~dev1_all.deb
          python3 -m py_compile scripts/qemu-iso-smoke.py packaging/live/localzet-live-ready.py
      - name: Check Live build scripts
        run: |
          for script in scripts/build-live-rootfs.sh scripts/assemble-live-iso.sh packaging/live/customize-rootfs.sh; do
            bash -n "$script"
          done
