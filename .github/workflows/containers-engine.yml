name: Localzet Containers real Docker lifecycle
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/localzet/containers.py'
      - 'tests/test_containers.py'
      - 'scripts/ci/containers-engine-smoke.sh'
      - '.github/workflows/containers-engine.yml'
permissions:
  contents: read
jobs:
  engine:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests
        run: PYTHONPATH=src python3 -m unittest discover -s tests -p test_containers.py -v
      - name: Install static fixture binary
        run: |
          sudo apt-get update
          sudo apt-get install -y busybox-static
          test -x /usr/bin/docker
      - name: Test actual engine without remote downloads
        run: LOCALZET_DISPOSABLE_VM=1 bash scripts/ci/containers-engine-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: containers-engine-evidence
          path: out/containers-engine/
          retention-days: 7
