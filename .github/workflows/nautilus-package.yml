name: Nautilus Executive package
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/nautilus-package.yml'
      - 'assets/styles/nautilus-executive.css'
      - 'scripts/patch-nautilus-style.py'
      - 'scripts/ci/build-nautilus.sh'
      - 'scripts/ci/nautilus-appearance-smoke.sh'
      - 'tests/test_nautilus_style.py'
permissions:
  contents: read
concurrency:
  group: nautilus-executive-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package:
    runs-on: ubuntu-26.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - name: Verify source patch
        run: python3 -m unittest discover -s tests -p test_nautilus_style.py -v
      - name: Rebuild from signed Ubuntu source and inspect real windows
        run: LOCALZET_DISPOSABLE_VM=1 bash scripts/ci/build-nautilus.sh
      - name: Upload package evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nautilus-executive-package-evidence
          path: out/nautilus/
          if-no-files-found: warn
          retention-days: 7
