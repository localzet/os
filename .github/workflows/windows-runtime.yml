name: Windows runtime smoke
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/localzet/windows_runtime.py'
      - 'tests/test_windows_runtime.py'
      - '.github/workflows/windows-runtime.yml'
permissions:
  contents: read
jobs:
  wine:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Wine and test compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends wine wine64 fonts-wine gcc-mingw-w64-x86-64 xvfb xauth
      - name: Compile and execute trusted fixture
        run: |
          mkdir -p out/runtime
          printf 'int main(void) { return 42; }\n' > out/runtime/smoke.c
          x86_64-w64-mingw32-gcc out/runtime/smoke.c -o out/runtime/smoke.exe
          export PYTHONPATH="$PWD/src"
          export XDG_DATA_HOME="$RUNNER_TEMP/localzet-runtime"
          export WINEDLLOVERRIDES="mscoree,mshtml="
          set +e
          timeout 180 xvfb-run -a python3 -m localzet.windows_runtime out/runtime/smoke.exe --profile smoke --run
          result=$?
          set -e
          test "$result" -eq 42
          test -f "$XDG_DATA_HOME/localzet/windows/prefixes/smoke/system.reg"
