name: Windows runtime smoke
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/localzet/windows_runtime.py'
      - 'tests/test_windows_runtime.py'
      - 'tests/fixtures/windows/**'
      - '.github/workflows/windows-runtime.yml'
permissions:
  contents: read
jobs:
  wine:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Wine and test compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends wine wine64 fonts-wine gcc-mingw-w64-x86-64 gcc-mingw-w64-i686 wixl xvfb xauth
      - name: Compile and execute trusted fixture
        run: |
          mkdir -p out/runtime
          printf 'int main(void) { return 42; }\n' > out/runtime/smoke.c
          x86_64-w64-mingw32-gcc out/runtime/smoke.c -o out/runtime/smoke64.exe
          i686-w64-mingw32-gcc out/runtime/smoke.c -o out/runtime/smoke32.exe
          cp tests/fixtures/windows/fixture.wxs out/runtime/
          printf 'Localzet original MSI fixture\n' > out/runtime/payload.txt
          (cd out/runtime && wixl -o fixture.msi fixture.wxs)
          dpkg-query -W wine wine64 libwine fonts-wine wixl | tee out/runtime/packages.txt
          file out/runtime/smoke*.exe | tee out/runtime/fixtures.txt
          python3 -m py_compile src/localzet/windows_runtime.py
          export PYTHONPATH="$PWD/src"
          export XDG_DATA_HOME="$RUNNER_TEMP/localzet-runtime"
          export WINEDLLOVERRIDES="mscoree,mshtml="
          export WINEPREFIX="$XDG_DATA_HOME/localzet/windows/prefixes/smoke"
          mkdir -p "$WINEPREFIX"
          WINESERVER="$(command -v wineserver || true)"
          if test -z "$WINESERVER"; then
            while IFS= read -r path; do
              case "$path" in
                */wineserver|*/wineserver64)
                  if test -x "$path" && test -f "$path"; then
                    WINESERVER="$path"
                    break
                  fi
                  ;;
              esac
            done < <(dpkg -L wine64 libwine wine-common)
          fi
          export WINESERVER
          test -x "$WINESERVER"
          echo "Wine server: $WINESERVER"
          timeout 420 xvfb-run -a bash -euo pipefail -c '
            wineboot --init
            "$WINESERVER" -w
            for bits in 64 32; do
              python3 -m localzet.windows_runtime "out/runtime/smoke$bits.exe" --profile smoke > "out/runtime/plan$bits.json"
              set +e
              python3 -m localzet.windows_runtime "out/runtime/smoke$bits.exe" --profile smoke --run
              result=$?
              set -e
              echo "Windows $bits-bit fixture exit code: $result" | tee "out/runtime/exit$bits.txt"
              "$WINESERVER" -w
              test "$result" -eq 42
              test -s "$WINEPREFIX/system.reg"
            done
            # Install the original MSI using the public Runtime entrypoint
            # into a distinct prefix. No UI bypass or proprietary installer.
            export WINEPREFIX="$XDG_DATA_HOME/localzet/windows/prefixes/msi-fixture"
            python3 -m localzet.windows_runtime out/runtime/fixture.msi --profile msi-fixture --run
            "$WINESERVER" -w
            test -s "$WINEPREFIX/system.reg"
            found="$(find "$WINEPREFIX/drive_c/users" -type f -path "*/LocalzetFixture/payload.txt")"
            test -n "$found"
            cmp "$found" out/runtime/payload.txt
            test -z "$(find "$XDG_DATA_HOME/localzet/windows/prefixes/smoke/drive_c" -type f -path "*/LocalzetFixture/payload.txt")"
            echo "PASS: MSI payload installed in selected prefix only" | tee out/runtime/msi-result.txt
          '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-wow64-fixture-evidence
          path: out/runtime/
          retention-days: 7
