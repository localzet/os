name: Windows runtime smoke
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/localzet/windows_runtime.py'
      - 'tests/test_windows_runtime.py'
      - '.github/workflows/windows-runtime.yml'
permissions:
  contents: read
jobs:
  wine:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Wine and test compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends wine wine64 fonts-wine gcc-mingw-w64-x86-64 xvfb xauth
      - name: Compile and execute trusted fixture
        run: |
          mkdir -p out/runtime
          printf 'int main(void) { return 42; }\n' > out/runtime/smoke.c
          x86_64-w64-mingw32-gcc out/runtime/smoke.c -o out/runtime/smoke.exe
          export PYTHONPATH="$PWD/src"
          export XDG_DATA_HOME="$RUNNER_TEMP/localzet-runtime"
          export WINEDLLOVERRIDES="mscoree,mshtml="
          export WINEPREFIX="$XDG_DATA_HOME/localzet/windows/prefixes/smoke"
          mkdir -p "$WINEPREFIX"
          export WINESERVER="$(command -v wineserver || true)"
          if test -z "$WINESERVER"; then
            WINESERVER="$(dpkg -L wine64 libwine | grep -E '/wineserver(64)? -a bash -euo pipefail -c '
            wineboot --init
            "$WINESERVER" -w
            set +e
            python3 -m localzet.windows_runtime out/runtime/smoke.exe --profile smoke --run
            result=$?
            set -e
            echo "Windows fixture exit code: $result"
            "$WINESERVER" -w
            test "$result" -eq 42
            test -s "$WINEPREFIX/system.reg"
          '
 | while read -r path; do if test -x "$path" && test -f "$path"; then printf '%s\n' "$path"; fi; done | head -n 1)"
          fi
          test -x "$WINESERVER"
          echo "Wine server: $WINESERVER"
          timeout 240 xvfb-run -a bash -euo pipefail -c '
            wineboot --init
            "$WINESERVER" -w
            set +e
            python3 -m localzet.windows_runtime out/runtime/smoke.exe --profile smoke --run
            result=$?
            set -e
            echo "Windows fixture exit code: $result"
            "$WINESERVER" -w
            test "$result" -eq 42
            test -s "$WINEPREFIX/system.reg"
          '
