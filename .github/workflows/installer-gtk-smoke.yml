name: Installer GTK smoke
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/localzet/installer/**'
      - 'packaging/installer/**'
      - 'scripts/ci/installer-gtk-smoke.sh'
      - '.github/workflows/installer-gtk-smoke.yml'
permissions:
  contents: read
jobs:
  gtk:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-gi gir1.2-adw-1 gir1.2-gtk-4.0 xvfb xauth dbus-x11 xdotool imagemagick
      - name: Open installer without privileged operations
        run: |
          bash -n scripts/ci/installer-gtk-smoke.sh
          xvfb-run -a -s "-screen 0 1280x800x24 -nolisten tcp" bash scripts/ci/installer-gtk-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: localzet-installer-gtk-smoke
          path: out/installer/
          retention-days: 7
