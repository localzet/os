name: Release download verification
on:
  pull_request:
    paths:
      - 'scripts/verify-release.py'
      - 'tests/test_release_verify.py'
      - '.github/workflows/release-verify.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install offline signature tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gnupg gpgv
      - name: Test real disposable signing keys and tampered inputs
        run: python3 -m unittest discover -s tests -p test_release_verify.py -v
