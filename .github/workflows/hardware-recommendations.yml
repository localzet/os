name: Hardware recommendations read-only
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/localzet/hardware.py'
      - 'tests/test_hardware.py'
      - 'src/localzet/hardware_install.py'
      - 'tests/test_hardware_install.py'
      - 'apps/localzet-hardware/**'
      - '.github/workflows/hardware-recommendations.yml'
permissions:
  contents: read
jobs:
  observe:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Ubuntu diagnostic tools only
        run: |
          sudo apt-get update
          sudo apt-get install -y ubuntu-drivers-common python3-apt mokutil
      - name: Verify administrator transaction guards
        run: PYTHONPATH=src /usr/bin/python3 -m unittest discover -s tests -p 'test_hardware*.py' -v
      - name: Observe actual runner hardware and archive
        run: |
          mkdir -p out/hardware
          /usr/bin/ubuntu-drivers list --recommended > out/hardware/ubuntu-recommended.txt
          PYTHONPATH=src /usr/bin/python3 -m localzet.hardware --resolve > out/hardware/plan.json
          PYTHONPATH=src /usr/bin/python3 - <<'PY'
          import json
          from pathlib import Path
          import apt
          from localzet.hardware import archive_candidate, parse_recommended
          result = json.loads(Path("out/hardware/plan.json").read_text())
          assert result["mode"] == "read-only" and not result["install_ready"]
          assert result["recommendations"]["status"] == "observed", result
          assert result["archive_status"] == "observed"
          assert result["cuda_compatible"] is None
          parse_recommended(Path("out/hardware/ubuntu-recommended.txt").read_text())
          candidate = archive_candidate(apt.Cache(), "linux-firmware")
          assert candidate["status"] == "ubuntu-candidate", candidate
          print("PASS: actual Ubuntu driver recommendations and signed archive candidate")
          PY
      - name: Simulate real signed archive dependency transaction without installation
        run: |
          sha256sum /var/lib/dpkg/status > out/hardware/dpkg-before.sha256
          PYTHONPATH=src /usr/bin/python3 -m localzet.hardware --simulate > out/hardware/driver-transaction.json
          PYTHONPATH=src /usr/bin/python3 - <<'PY'
          import apt, json
          from pathlib import Path
          from localzet.hardware import simulate_packages
          result = simulate_packages(apt.Cache(), ("mesa-utils",))
          assert result["status"] == "simulated", result
          assert not result["install_ready"]
          assert result["targets"] == ["mesa-utils"]
          Path("out/hardware/apt-simulation.json").write_text(json.dumps(result, indent=2))
          print("PASS: actual APT dependency simulation, no commit")
          PY
          sha256sum -c out/hardware/dpkg-before.sha256
      - name: Exercise actual commit and system lock on disposable runner fixture
        run: |
          sudo env PYTHONPATH=src /usr/bin/python3 - <<'PY'
          import apt, apt_pkg, copy, json
          from localzet.hardware import simulate_packages
          from localzet.hardware_install import apply_reviewed
          # This is intentionally NOT a GPU transaction. Use a tiny signed
          # package on the disposable GitHub runner to verify the real API.
          def fixture_review(cache):
              transaction = simulate_packages(cache, ("hello",), retain_marks=True)
              assert transaction["status"] == "simulated", transaction
              assert all(row["name"] == "hello" for row in transaction["changes"]), transaction
              return {"kernel": "fixture", "secure_boot": "fixture", "graphics": [],
                      "targets": ["hello"], "target_versions": {"hello": cache["hello"].candidate.version},
                      "changes": transaction["changes"], "download_bytes": transaction["download_bytes"],
                      "additional_installed_bytes": transaction["additional_installed_bytes"]}
          with apt_pkg.SystemLock():
              cache = apt.Cache()
              assert not cache["hello"].is_installed, "Expected a fresh disposable runner"
              approved = fixture_review(cache)
              cache.clear()
          records = []
          with apt_pkg.SystemLock():
              state = apply_reviewed(apt.Cache(), approved, review_fn=fixture_review,
                                     receipt_fn=lambda record: records.append(copy.deepcopy(record)))
          assert state == "installed-reboot-verification-required"
          assert apt.Cache()["hello"].is_installed
          assert [record["state"] for record in records] == ["installing", state]
          print("PASS: real APT locked commit and receipt on disposable runner fixture")
          PY
          /usr/bin/hello
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hardware-recommendations
          path: out/hardware/
          retention-days: 7
