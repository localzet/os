name: Telegram preloaded installed image
on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/install-telegram-rootfs.sh'
      - 'scripts/build-live-rootfs.sh'
      - 'packaging/live/customize-rootfs.sh'
      - 'scripts/qemu-interactive-install-smoke.py'
      - '.github/workflows/telegram-preloaded.yml'
permissions:
  contents: read
jobs:
  installed:
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Validate and build actual preloaded Standard image
        run: |
          make test
          sudo apt-get update
          sudo apt-get install -y curl mmdebstrap ubuntu-keyring squashfs-tools xorriso grub-common grub-pc-bin grub-efi-amd64-bin mtools gdisk dosfstools e2fsprogs qemu-system-x86 ovmf acl gcc-mingw-w64-x86-64 python3-pil
          if test -c /dev/kvm; then sudo setfacl -m "u:$(id -un):rw" /dev/kvm; fi
          mkdir -p dist
          sudo env LOCALZET_DISPOSABLE_VM=1 LOCALZET_INSTALLER=1 LOCALZET_WINDOWS=1 LOCALZET_ARCHIVE_PROFILE=standard LOCALZET_EXPERIMENTAL_TELEGRAM=1 bash scripts/build-live-rootfs.sh "$RUNNER_TEMP/candidate-root"
          sudo cp -a "$RUNNER_TEMP/candidate-root/usr/share/localzet/telegram-review" dist/
          sudo env LOCALZET_INSTALLER=1 bash scripts/assemble-live-iso.sh "$RUNNER_TEMP/candidate-root" "$PWD/dist/telegram-standard.iso"
          (cd dist && sha256sum -c telegram-standard.iso.sha256)
      - name: Install and launch real Telegram without external networking
        run: |
          printf 'int main(void) { return 42; }\n' > "$RUNNER_TEMP/smoke.c"
          x86_64-w64-mingw32-gcc "$RUNNER_TEMP/smoke.c" -o "$RUNNER_TEMP/smoke.exe"
          python3 scripts/qemu-interactive-install-smoke.py dist/telegram-standard.iso \
            --ovmf-code /usr/share/OVMF/OVMF_CODE_4M.secboot.fd \
            --ovmf-vars /usr/share/OVMF/OVMF_VARS_4M.fd \
            --boot-media usb --fixture "$RUNNER_TEMP/smoke.exe" --logs dist/candidate-logs \
            --expect-archive-profile standard --expect-preloaded-telegram
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: telegram-preloaded-installed-evidence
          path: |
            dist/telegram-review/
            dist/candidate-logs/
          retention-days: 7
