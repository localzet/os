name: Aurora Complete unified release candidate
on:
  pull_request:
    branches: [integration/aurora-complete-candidate]
permissions:
  contents: read
concurrency:
  group: aurora-unified-candidate-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  files:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'integration/aurora-release-candidate'
    runs-on: ubuntu-26.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - name: Validate combined source
        run: make test
      - name: Verify source patch
        run: |
          python3 -m unittest discover -s tests -p test_nautilus_style.py -v
          python3 -m unittest discover -s tests -p test_nautilus_bundle_checksums.py -v
      - name: Rebuild from signed Ubuntu source and inspect real windows
        run: LOCALZET_DISPOSABLE_VM=1 bash scripts/ci/build-nautilus.sh
      - name: Upload package evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nautilus-executive-package-evidence
          path: out/nautilus/
          if-no-files-found: warn
          retention-days: 7

  control-center:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'integration/aurora-release-candidate'
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Source patch tests
        run: python3 -m unittest discover -s tests -p test_control_center_brand.py -v
      - name: Build from signed Ubuntu source and verify About
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pil
          LOCALZET_DISPOSABLE_VM=1 bash scripts/ci/build-control-center.sh
      - name: Upload engineering evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: control-center-build-evidence
          path: out/control-center/
          if-no-files-found: warn
          retention-days: 7

  installed-image:
    needs: [files, control-center]
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'integration/aurora-release-candidate'
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: nautilus-executive-package-evidence
          path: out/nautilus/
      - uses: actions/download-artifact@v4
        with:
          name: control-center-build-evidence
          path: out/control-center/
      - name: Assemble exact Complete candidate with both verified native packages
        run: |
          sudo apt-get update
          sudo apt-get install -y curl mmdebstrap ubuntu-keyring squashfs-tools xorriso grub-common grub-pc-bin grub-efi-amd64-bin mtools qemu-system-x86 ovmf acl gcc-mingw-w64-x86-64 python3-pil
          if test -c /dev/kvm; then sudo setfacl -m "u:$(id -un):rw" /dev/kvm; fi
          mkdir -p dist
          sudo env LOCALZET_DISPOSABLE_VM=1 LOCALZET_INSTALLER=1 LOCALZET_WINDOWS=1 LOCALZET_ARCHIVE_PROFILE=complete LOCALZET_EXPERIMENTAL_CONTAINERS=1 LOCALZET_EXPERIMENTAL_ONLYOFFICE=1 LOCALZET_NAUTILUS_BUNDLE="$PWD/out/nautilus" LOCALZET_CONTROL_CENTER_BUNDLE="$PWD/out/control-center" LOCALZET_EXPERIMENTAL_HARDWARE_AUTO=1 bash scripts/build-live-rootfs.sh "$RUNNER_TEMP/candidate-root"
          sudo env LOCALZET_INSTALLER=1 bash scripts/assemble-live-iso.sh "$RUNNER_TEMP/candidate-root" "$PWD/dist/localzet-aurora-complete-rc.iso"
          (cd dist && sha256sum -c localzet-aurora-complete-rc.iso.sha256)
      - name: Install and validate actual desktop and native Files
        run: |
          printf 'int main(void) { return 42; }\n' > "$RUNNER_TEMP/smoke.c"
          x86_64-w64-mingw32-gcc "$RUNNER_TEMP/smoke.c" -o "$RUNNER_TEMP/smoke.exe"
          python3 scripts/qemu-interactive-install-smoke.py dist/localzet-aurora-complete-rc.iso \
            --ovmf-code /usr/share/OVMF/OVMF_CODE_4M.secboot.fd \
            --ovmf-vars /usr/share/OVMF/OVMF_VARS_4M.fd \
            --boot-media usb --fixture "$RUNNER_TEMP/smoke.exe" --logs dist/candidate-logs \
            --expect-archive-profile complete --expect-containers --expect-office --expect-executive-review --expect-native-files --expect-branded-control-center
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aurora-complete-rc-installed-evidence
          path: dist/candidate-logs/
          if-no-files-found: warn
          retention-days: 7
      - name: Record provenance
        run: |
          git rev-parse HEAD > dist/BUILD-COMMIT
          cmp dist/BUILD-COMMIT out/nautilus/BUILD-COMMIT
          cmp dist/BUILD-COMMIT out/control-center/BUILD-COMMIT
          (cd dist && sha256sum -c localzet-aurora-complete-rc.iso.sha256)
          sudo cat "$RUNNER_TEMP/candidate-root/usr/share/localzet/archive-profile-plan.json" > dist/archive-profile-plan.json
      - uses: actions/upload-artifact@v4
        with:
          name: aurora-complete-rc-engineering-image
          path: |
            dist/localzet-aurora-complete-rc.iso
            dist/localzet-aurora-complete-rc.iso.sha256
            dist/BUILD-COMMIT
            dist/archive-profile-plan.json
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
