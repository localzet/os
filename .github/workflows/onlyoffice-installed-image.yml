name: ONLYOFFICE installed image review
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/install-onlyoffice-rootfs.sh'
      - 'scripts/build-live-rootfs.sh'
      - 'scripts/qemu-interactive-install-smoke.py'
      - 'scripts/visual-evidence.py'
      - 'tests/test_visual_evidence.py'
      - 'packaging/live/customize-rootfs.sh'
      - '.github/workflows/onlyoffice-installed-image.yml'
permissions:
  contents: read
concurrency:
  group: office-installed-image-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  candidate:
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        mode: [native, software, fresh-profile, private-bus, isolated-x11]
    steps:
      - uses: actions/checkout@v4
      - name: Validate source
        run: |
          make test
          for script in scripts/build-live-rootfs.sh scripts/assemble-live-iso.sh packaging/live/customize-rootfs.sh packaging/installer/*.sh; do
            bash -n "$script"
          done
          python3 -m py_compile scripts/qemu-interactive-install-smoke.py
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y curl mmdebstrap ubuntu-keyring squashfs-tools xorriso grub-common grub-pc-bin grub-efi-amd64-bin mtools qemu-system-x86 ovmf acl gcc-mingw-w64-x86-64 python3-pil
          if test -c /dev/kvm; then sudo setfacl -m "u:$(id -un):rw" /dev/kvm; fi
      - name: Build exact interactive candidate
        env:
          OFFICE_MODE: ${{ matrix.mode }}
        run: |
          mkdir -p dist
          diagnostic=0
          if [[ "$OFFICE_MODE" == isolated-x11 ]]; then diagnostic=1; fi
          sudo env LOCALZET_OFFICE_X11_DIAGNOSTIC="$diagnostic" LOCALZET_DISPOSABLE_VM=1 LOCALZET_INSTALLER=1 LOCALZET_WINDOWS=1 LOCALZET_ARCHIVE_PROFILE=complete LOCALZET_EXPERIMENTAL_CONTAINERS=1 LOCALZET_EXPERIMENTAL_HARDWARE_AUTO=1 LOCALZET_EXPERIMENTAL_ONLYOFFICE=1 bash scripts/build-live-rootfs.sh "$RUNNER_TEMP/candidate-root"
          sudo env LOCALZET_INSTALLER=1 bash scripts/assemble-live-iso.sh "$RUNNER_TEMP/candidate-root" "$PWD/dist/localzet-uefi-candidate.iso"
          (cd dist && sha256sum -c localzet-uefi-candidate.iso.sha256)
      - name: Compile original Windows fixture
        run: |
          printf 'int main(void) { return 42; }\n' > "$RUNNER_TEMP/smoke.c"
          x86_64-w64-mingw32-gcc "$RUNNER_TEMP/smoke.c" -o "$RUNNER_TEMP/smoke.exe"
      - name: Install candidate from USB and authenticate installed GNOME desktop
        env:
          OFFICE_MODE: ${{ matrix.mode }}
        run: |
          # Keep native GNOME mandatory; compare software rendering in the
          # same session and isolated X11 as independent diagnostic jobs.
          render_mode="$OFFICE_MODE"
          if [[ "$render_mode" == native ]]; then render_mode=default; fi
          review=(--expect-executive-review --office-render-mode "$render_mode")
          python3 scripts/qemu-interactive-install-smoke.py dist/localzet-uefi-candidate.iso \
            --ovmf-code /usr/share/OVMF/OVMF_CODE_4M.secboot.fd \
            --ovmf-vars /usr/share/OVMF/OVMF_VARS_4M.fd \
            --boot-media usb \
            --fixture "$RUNNER_TEMP/smoke.exe" \
            --logs dist/candidate-logs --expect-archive-profile complete --expect-containers --expect-office "${review[@]}"
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: onlyoffice-installed-image-evidence-${{ matrix.mode }}
          path: dist/candidate-logs/
          if-no-files-found: warn
          retention-days: 7
      - name: Record reviewed candidate provenance
        if: success() && matrix.mode == 'native' && github.event_name == 'pull_request' && github.head_ref == 'integration/executive-complete-preview' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git rev-parse HEAD > dist/BUILD-COMMIT
          sudo cat "$RUNNER_TEMP/candidate-root/usr/share/localzet/archive-profile-plan.json" > dist/archive-profile-plan.json
          (cd dist && sha256sum -c localzet-uefi-candidate.iso.sha256)
      - name: Publish verified engineering candidate (not a release)
        if: success() && matrix.mode == 'native' && github.event_name == 'pull_request' && github.head_ref == 'integration/executive-complete-preview' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@v4
        with:
          name: executive-complete-engineering-preview
          path: |
            dist/localzet-uefi-candidate.iso
            dist/localzet-uefi-candidate.iso.sha256
            dist/BUILD-COMMIT
            dist/archive-profile-plan.json
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
