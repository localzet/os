name: NectarLink package verification
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'packaging/nectarlink/**'
      - 'scripts/fetch-nectarlink-deb.py'
      - '.github/workflows/connect-package.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and verify pinned upstream DEB
        run: python3 scripts/fetch-nectarlink-deb.py --output out/nectarlink
      - name: Inspect package without installing
        run: |
          mkdir -p out/review
          deb=out/nectarlink/nectarlink_0.1.5_amd64.deb
          dpkg-deb --info "$deb" > out/review/package-info.txt
          dpkg-deb --contents "$deb" > out/review/package-contents.txt
          dpkg-deb --control "$deb" out/review/control
      - name: Upload metadata only
        uses: actions/upload-artifact@v4
        with:
          name: nectarlink-package-review
          path: out/review/
          retention-days: 7
