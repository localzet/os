# Mirror early bootloader output to the diagnostic serial port.
serial --unit=0 --speed=115200 --word=8 --parity=no --stop=1
terminal_output console serial
terminal_input console serial

set default=0
set timeout=8

menuentry "Localzet OS - Russian / RU" {
    linux /casper/vmlinuz boot=casper username=localzet hostname=localzet-live locale=ru_RU.UTF-8 nopersistent console=tty0 console=ttyS0,115200n8 systemd.show_status=1 ---
    initrd /casper/initrd
}
menuentry "Localzet OS - English / EN" {
    linux /casper/vmlinuz boot=casper username=localzet hostname=localzet-live locale=en_US.UTF-8 nopersistent console=tty0 console=ttyS0,115200n8 systemd.show_status=1 ---
    initrd /casper/initrd
}
