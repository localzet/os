# Quiet boot by default. Serial kernel diagnostics are opt-in.
set default=0
set timeout=5

menuentry "Localzet OS - Russian / RU" {
    linux /casper/vmlinuz boot=casper username=localzet hostname=localzet-live locale=ru_RU.UTF-8 nopersistent quiet splash ---
    initrd /casper/initrd
}
menuentry "Localzet OS - English / EN" {
    linux /casper/vmlinuz boot=casper username=localzet hostname=localzet-live locale=en_US.UTF-8 nopersistent quiet splash ---
    initrd /casper/initrd
}
menuentry "Localzet OS - diagnostics / recovery" {
    linux /casper/vmlinuz boot=casper username=localzet hostname=localzet-live locale=ru_RU.UTF-8 nopersistent console=tty0 console=ttyS0,115200n8 systemd.show_status=1 systemd.mask=serial-getty@ttyS0.service ---
    initrd /casper/initrd
}
